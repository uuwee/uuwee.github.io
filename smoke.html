<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clingcon WASM smoke test</title>
  <link rel="stylesheet" href="./smoke.css">
</head>
<body>
  <main>
    <h1>Clingcon WASM smoke test</h1>
    <p>このページは Clingcon WASM がブラウザで動作するか確認するための最小テストです。</p>
    <textarea id="program" spellcheck="false">&dom { 1..3 } = x.
&sum { x } = 2.
ok.
#show ok/0.</textarea>
    <div class="actions">
      <button id="run">Solve</button>
      <span id="status">未実行</span>
    </div>
    <h2>stdout</h2>
    <pre id="stdout"></pre>
    <h2>stderr</h2>
    <pre id="stderr"></pre>
  </main>
  <footer><a href="./index.html">シフト作成へ戻る</a> / <a href="./licenses.html">第三者ライセンス</a></footer>
  <script src="./dist/clingcon-demo.js"></script>
  <script src="./demo.js"></script>
</body>
</html>
